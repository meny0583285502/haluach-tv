name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk haluach-tv.apk
      - run: cd tools && zip ../TV-Cleaner.zip TV-Cleaner.bat
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: הלוח TV - גרסה ${{ github.run_number }}
          files: |
            haluach-tv.apk
            TV-Cleaner.zip
          make_latest: true
